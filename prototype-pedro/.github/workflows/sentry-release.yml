name: Sentry Release

on:
  push:
    branches: [main]

jobs:
  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Sentry CLI
        run: npm install -g @sentry/cli
        continue-on-error: true

      - name: Create Sentry release
        run: sentry-cli releases new "${{ github.sha }}"
        continue-on-error: true

      - name: Associate commits
        run: sentry-cli releases set-commits "${{ github.sha }}" --auto
        continue-on-error: true

      - name: Upload source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: sentry-cli sourcemaps upload --release "${{ github.sha }}" .next
        continue-on-error: true

      - name: Finalize release
        run: sentry-cli releases finalize "${{ github.sha }}"
        continue-on-error: true
